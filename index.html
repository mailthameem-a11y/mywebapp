<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அட்மின் பேனல் - Royal Nuts</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 20px; margin: 0;}
        h1 { text-align: center; color: #0f172a; margin-bottom: 25px;}
        .dashboard-container { display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap;}
        
        .left-panel { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 20px;}
        .form-section { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.06); }
        .form-section h3 { margin-top: 0; color: #16a34a; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px;}
        .form-section input { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;}
        
        .weight-row { display: flex; gap: 10px; margin-bottom: 10px;}
        .weight-row input { margin: 0;}
        .submit-btn { background: #16a34a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .submit-btn:hover { background: #15803d; }
        
        .bulk-box { background: #ecfdf5; border: 1px dashed #059669; }
        .bulk-box h3 { color: #059669; }
        .bulk-btn { background: #059669; }
        .bulk-btn:hover { background: #047857; }

        .products-section { flex: 2; min-width: 320px;}
        .products-section h2 { margin-top: 0; }
        .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        .card img { width: 85px; height: 85px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0;}
        .card-info { flex: 1; }
        .card-info h3 { margin: 0 0 6px; color: #0f172a;}
        .card-info p { margin: 0; color: #475569; font-size: 0.95rem; line-height: 1.5;}
        
        .card-actions { display: flex; gap: 8px; }
        .card-actions button { padding: 9px 13px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold;}
        .edit-btn { background: #eab308; color: #1e293b !important; }
        .del-btn { background: #ef4444; }

        /* Edit Popup Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;}
        .modal { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative;}
        .modal h3 { margin-top: 0; }
        .modal input { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;}
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 1.4rem; cursor: pointer; border: none; background: none;}
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-actions button { padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none;}
        .cancel-btn { background: #f1f5f9; color: #475569; }
        .save-btn { background: #2563eb; color: white; }
    </style>
</head>
<body>
    <h1>🛒 அட்மின் பேனல்</h1>
    <div class="dashboard-container">
        
        <div class="left-panel">
            <!-- 1. Google Sheet / CSV Bulk Upload Box -->
            <div class="form-section bulk-box">
                <h3>📊 Google Sheet / CSV Upload</h3>
                <p style="font-size: 0.85rem; color: #065f46; margin: 0 0 12px;">Google Sheet-ல் இருந்து டவுன்லோட் செய்த <strong>.csv</strong> ஃபைலைத் தேர்ந்தெடுக்கவும்:</p>
                <input type="file" id="csvFileInput" accept=".csv" style="background: white;">
                <button type="button" class="submit-btn bulk-btn" onclick="handleCSVUpload()">⚡ மொத்தமாக பதிவேற்று</button>
            </div>

            <!-- 2. Single Product Add Form -->
            <div class="form-section">
                <h3>+ ஒரு பொருளை மட்டும் சேர்க்க</h3>
                <form action="/add-product-dynamic" method="POST">
                    <label>வகை (Category)</label>
                    <input type="text" name="category" placeholder="எ.கா: Nuts, Dates" required>
                    
                    <label>பெயர் (Product Name)</label>
                    <input type="text" name="name" placeholder="எ.கா: Badam" required>
                    
                    <label>ஸ்டாக் (Stock)</label>
                    <input type="number" name="stock" placeholder="எ.கா: 50" required>
                    
                    <label>படத்தின் லிங்க் (Image URL)</label>
                    <input type="text" name="image" placeholder="https://..." required>

                    <h4 style="margin: 10px 0; color: #334155; font-size: 0.95rem;">எடைகள் & விலைகள்</h4>
                    <div class="weight-row">
                        <input type="text" name="weight1" placeholder="250g" required>
                        <input type="number" name="price1" placeholder="₹" required>
                    </div>
                    <div class="weight-row">
                        <input type="text" name="weight2" placeholder="500g">
                        <input type="number" name="price2" placeholder="₹">
                    </div>
                    <div class="weight-row">
                        <input type="text" name="weight3" placeholder="1kg">
                        <input type="number" name="price3" placeholder="₹">
                    </div>

                    <button type="submit" class="submit-btn">💾 டேட்டாபேஸில் சேமி</button>
                </form>
            </div>
        </div>

        <!-- Product List -->
        <div class="products-section">
            <h2>உள்ள பொருட்கள்</h2>
            <div id="product-list">லோட் ஆகிறது...</div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <h3>பொருளை மாற்று (Edit)</h3>
            <input type="hidden" id="edit-id">
            <label>வகை</label>
            <input type="text" id="edit-category">
            <label>பெயர்</label>
            <input type="text" id="edit-name">
            <label>விலை (₹)</label>
            <input type="number" id="edit-price">
            <label>ஸ்டாக்</label>
            <input type="number" id="edit-stock">
            <label>படத்தின் லிங்க்</label>
            <input type="text" id="edit-image">
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="save-btn" onclick="saveEdit()">💾 சேமி</button>
            </div>
        </div>
    </div>

    <script>
        fetch('/products').then(res => res.json()).then(products => {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            products.forEach(p => {
                const imgSrc = p.image || 'https://images.unsplash.com/photo-1596591606975-97ee5cef3a1e?q=80&w=200';
                const encodedImg = encodeURIComponent(imgSrc);

                let priceText = '';
                if (p.weights && p.weights.length > 0) {
                    priceText = p.weights.map(w => `${w.weight}: ₹${w.price}`).join(' | ');
                } else if (p.price) {
                    priceText = `₹${p.price}`;
                } else {
                    priceText = 'விலை குறிப்பிடப்படவில்லை';
                }

                list.innerHTML += `
                    <div class="card">
                        <img src="${imgSrc}" alt="${p.name}">
                        <div class="card-info">
                            <h3>${p.name}</h3>
                            <p><strong>விலை:</strong> ${priceText} <br> <strong>ஸ்டாக்:</strong> ${p.stock} &nbsp;|&nbsp; <strong>வகை:</strong> ${p.category}</p>
                        </div>
                        <div class="card-actions">
                            <button class="edit-btn" onclick="openEditModal('${p._id}', '${p.name}', '${p.category || ''}', '${p.price || 0}', '${p.stock || 0}', '${encodedImg}')">✏️ Edit</button>
                            <button class="del-btn" onclick="deleteProduct('${p._id}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });
        });

        // CSV கோப்பை வாசித்து சர்வருக்கு அனுப்பும் லாஜிக்
        function handleCSVUpload() {
            const fileInput = document.getElementById('csvFileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("தயவுசெய்து ஒரு .csv ஃபைலைத் தேர்ந்தெடுக்கவும்!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split(/\r?\n/).filter(r => r.trim() !== '');
                if (rows.length < 2) {
                    alert("CSV ஃபைலில் தகவல்கள் எதுவும் இல்லை!");
                    return;
                }

                const headers = rows[0].split(',').map(h => h.trim().toLowerCase());
                const products = [];

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(',').map(c => c.trim());
                    if (cols.length < 3) continue;

                    let rowData = {};
                    headers.forEach((h, idx) => {
                        rowData[h] = cols[idx] || '';
                    });

                    let weights = [];
                    if (rowData.weight1 && rowData.price1) weights.push({ weight: rowData.weight1, price: Number(rowData.price1) });
                    if (rowData.weight2 && rowData.price2) weights.push({ weight: rowData.weight2, price: Number(rowData.price2) });
                    if (rowData.weight3 && rowData.price3) weights.push({ weight: rowData.weight3, price: Number(rowData.price3) });

                    const basePrice = weights.length > 0 ? weights[0].price : (Number(rowData.price) || 0);

                    products.push({
                        category: rowData.category,
                        name: rowData.name,
                        stock: Number(rowData.stock) || 0,
                        image: rowData.image,
                        price: basePrice,
                        weights: weights
                    });
                }

                if (products.length === 0) {
                    alert("பொருட்கள் சரியாக வாசிக்கப்படவில்லை. தலைப்புகளைச் சரிபார்க்கவும்.");
                    return;
                }

                fetch('/bulk-add-products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(products)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(`வெற்றி! ${data.count} பொருட்கள் ஒரே நேரத்தில் சேர்க்கப்பட்டன! 🎉`);
                        window.location.reload();
                    } else {
                        alert("பிழை: " + data.error);
                    }
                })
                .catch(err => alert("பதிவேற்றத்தில் பிழை ஏற்பட்டது: " + err.message));
            };

            reader.readAsText(file);
        }

        function deleteProduct(id) {
            if(confirm("நிச்சயமாக அழிக்க வேண்டுமா?")) {
                fetch('/delete-product/' + id).then(() => window.location.reload());
            }
        }

        function openEditModal(id, name, category, price, stock, encodedImage) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-category').value = category;
            document.getElementById('edit-price').value = price;
            document.getElementById('edit-stock').value = stock;
            document.getElementById('edit-image').value = decodeURIComponent(encodedImage);
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveEdit() {
            const id = document.getElementById('edit-id').value;
            fetch('/update-product/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('edit-name').value,
                    category: document.getElementById('edit-category').value,
                    price: Number(document.getElementById('edit-price').value),
                    stock: Number(document.getElementById('edit-stock').value),
                    image: document.getElementById('edit-image').value
                })
            }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
