<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அட்மின் பேனல் - Royal Nuts</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 20px;}
        .dashboard-container { display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap;}
        .form-section { flex: 1; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 300px;}
        .form-section input, .form-section select { width: 100%; padding: 10px; margin: 10px 0 20px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;}
        .submit-btn { background: #16a34a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold;}
        .products-section { flex: 2; min-width: 300px;}
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .card img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px;}
        .card-info { flex: 1; }
        .card-actions button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold;}
        .edit-btn { background: #eab308; margin-right: 5px; color: black !important;}
        .del-btn { background: #ef4444; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">🛒 அட்மின் பேனல்</h1>
    <div class="dashboard-container">
        <div class="form-section">
            <h3>புதிய பொருளைச் சேர்க்க</h3>
            <form action="/add-product-dynamic" method="POST">
                <label>பொருளின் வகை (Category)</label>
                <input type="text" name="category" placeholder="எ.கா: Dates, Nuts" required>
                <label>பொருளின் பெயர்</label>
                <input type="text" name="name" placeholder="எ.கா: Ajwa Dates 500g" required>
                <label>விலை (₹)</label>
                <input type="number" name="price" required>
                <label>ஸ்டாக் அளவு</label>
                <input type="number" name="stock" required>
                <label>படத்தின் லிங்க் (Image URL)</label>
                <input type="text" name="image" placeholder="https://... (படத்தின் லிங்க்)" required>
                <button type="submit" class="submit-btn">💾 டேட்டாபேஸில் சேமி</button>
            </form>
        </div>
        <div class="products-section">
            <h2>உள்ள பொருட்கள்</h2>
            <div id="product-list">லோட் ஆகிறது...</div>
        </div>
    </div>

    <script>
        fetch('/products').then(res => res.json()).then(products => {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            products.forEach(p => {
                const imgSrc = p.image || 'https://images.unsplash.com/photo-1596591606975-97ee5cef3a1e?q=80&w=200';
                list.innerHTML += `
                    <div class="card">
                        <img src="${imgSrc}" alt="${p.name}">
                        <div class="card-info">
                            <h3 style="margin:0 0 5px;">${p.name}</h3>
                            <p style="margin:0; color: #64748b;">₹${p.price} | ஸ்டாக்: ${p.stock} | ${p.category}</p>
                        </div>
                        <div class="card-actions">
                            <button class="edit-btn" onclick="editProduct('${p._id}', '${p.name}', '${p.price}', '${p.stock}')">✏ Edit</button>
                            <button class="del-btn" onclick="deleteProduct('${p._id}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        });

        function deleteProduct(id) {
            if(confirm("நிச்சயமாக அழிக்க வேண்டுமா?")) {
                fetch('/delete-product/' + id).then(() => window.location.reload());
            }
        }

        // Edit Function Logic
        function editProduct(id, name, oldPrice, oldStock) {
            let newPrice = prompt(name + " - புதிய விலையை உள்ளிடவும்:", oldPrice);
            if (!newPrice) return; 
            let newStock = prompt(name + " - புதிய ஸ்டாக் அளவை உள்ளிடவும்:", oldStock);
            if (!newStock) return;

            fetch('/update-product/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ price: newPrice, stock: newStock })
            }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
