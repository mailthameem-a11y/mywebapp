<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அட்மின் பேனல் - Royal Nuts</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4f8; padding: 20px; color: #0f172a;}
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px; }
        .header-bar h1 { font-size: 1.8rem; }
        .logout-btn { background: #fee2e2; color: #b91c1c; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; border: 1px solid #f87171; font-size: 0.9rem;}
        
        /* Tab Navigation */
        .tab-bar { max-width: 1200px; margin: 0 auto 25px; display: flex; gap: 10px; border-bottom: 2px solid #cbd5e1; padding-bottom: 2px;}
        .tab-btn { background: none; border: none; padding: 10px 22px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; color: #64748b; border-bottom: 3px solid transparent; margin-bottom: -4px;}
        .tab-btn.active { color: #16a34a; border-color: #16a34a; }
        .badge { background: #ef4444; color: white; border-radius: 12px; padding: 2px 8px; font-size: 0.75rem; margin-left: 6px;}

        .container { max-width: 1200px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Orders Dashboard Styling */
        .orders-grid { display: flex; flex-direction: column; gap: 16px; }
        .order-card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .order-id { font-weight: 800; color: #0f172a; font-size: 1.05rem; }
        .order-date { color: #64748b; font-size: 0.85rem; }
        
        .order-body { display: grid; grid-template-columns: 1fr 1.5fr 1.2fr; gap: 20px; align-items: center; }
        @media(max-width: 820px) { .order-body { grid-template-columns: 1fr; gap: 14px; } }
        
        .customer-info p { margin-bottom: 4px; font-size: 0.9rem; color: #334155; }
        .customer-info strong { color: #0f172a; }
        .customer-info a { color: #16a34a; text-decoration: none; font-weight: 600; }
        
        .order-items-list { background: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; max-height: 120px; overflow-y: auto;}
        .order-items-list div { padding: 3px 0; border-bottom: 1px dashed #e2e8f0; display: flex; justify-content: space-between;}
        .order-items-list div:last-child { border: none; }

        .order-status-box { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        @media(max-width: 820px) { .order-status-box { align-items: flex-start; } }
        .order-total { font-size: 1.3rem; font-weight: 800; color: #16a34a; }
        
        .action-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .status-select { padding: 8px 10px; border-radius: 8px; font-weight: 700; font-family: inherit; font-size: 0.85rem; border: 1.5px solid #cbd5e1; outline: none; cursor: pointer;}
        .status-Pending { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
        .status-Dispatched { background: #e0f2fe; color: #0369a1; border-color: #0284c7; }
        .status-Delivered { background: #dcfce7; color: #15803d; border-color: #22c55e; }
        .status-Cancelled { background: #fee2e2; color: #b91c1c; border-color: #ef4444; }

        .print-btn { background: #0f172a; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s;}
        .print-btn:hover { background: #334155; }

        /* Products Section Styles */
        .dashboard-container { display: flex; gap: 30px; flex-wrap: wrap;}
        .left-panel { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 20px;}
        .form-section { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.06); }
        .form-section h3 { margin-top: 0; color: #16a34a; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px;}
        .form-section input { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;}
        .weight-row { display: flex; gap: 10px; margin-bottom: 10px;}
        .weight-row input { margin: 0;}
        .submit-btn { background: #16a34a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .bulk-box { background: #ecfdf5; border: 1px dashed #059669; }
        .bulk-box h3 { color: #059669; }
        .bulk-btn { background: #059669; }
        .products-section { flex: 2; min-width: 320px;}
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;}
        .clean-btn { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem;}
        .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        .card img { width: 85px; height: 85px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0;}
        .card-info { flex: 1; }
        .card-info h3 { margin: 0 0 6px; color: #0f172a;}
        .card-info p { margin: 0; color: #475569; font-size: 0.95rem; line-height: 1.5;}
        .card-actions { display: flex; gap: 8px; }
        .card-actions button { padding: 9px 13px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold;}
        .edit-btn { background: #eab308; color: #1e293b !important; }
        .del-btn { background: #ef4444; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px);}
        .modal { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative;}
        .modal h3 { margin-top: 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;}
        .modal label { font-weight: 600; color: #475569; font-size: 0.85rem;}
        .modal input { width: 100%; padding: 10px; margin: 4px 0 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;}
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 1.4rem; cursor: pointer; border: none; background: none;}
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;}
        .modal-actions button { padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none;}
        .cancel-btn { background: #f1f5f9; color: #475569; }
        .save-btn { background: #2563eb; color: white; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🛒 அட்மின் பேனல் - Royal Nuts</h1>
        <a href="/admin/logout" class="logout-btn">🚪 வெளியேறு (Logout)</a>
    </div>

    <!-- Tabs Navigation -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('orders')">📦 ஆர்டர்கள் (Orders) <span class="badge" id="pending-count">0</span></button>
        <button class="tab-btn" onclick="switchTab('products')">🏷️ பொருட்கள் (Products)</button>
    </div>

    <div class="container">
        
        <!-- 1. ORDERS TAB CONTENT -->
        <div class="tab-content active" id="orders-tab">
            <div class="orders-grid" id="orders-list">
                <p style="text-align: center; color: #64748b; padding: 40px;">ஆர்டர்கள் லோட் ஆகிறது...</p>
            </div>
        </div>

        <!-- 2. PRODUCTS TAB CONTENT -->
        <div class="tab-content" id="products-tab">
            <div class="dashboard-container">
                <div class="left-panel">
                    <div class="form-section bulk-box">
                        <h3>📊 Google Sheet / CSV Upload</h3>
                        <p style="font-size: 0.85rem; color: #065f46; margin: 0 0 12px;">.csv ஃபைலைத் தேர்ந்தெடுக்கவும்:</p>
                        <input type="file" id="csvFileInput" accept=".csv" style="background: white;">
                        <button type="button" class="submit-btn bulk-btn" onclick="handleCSVUpload()">⚡ மொத்தமாக பதிவேற்று</button>
                    </div>

                    <div class="form-section">
                        <h3>+ ஒரு பொருளை மட்டும் சேர்க்க</h3>
                        <form action="/add-product-dynamic" method="POST">
                            <label>வகை (Category)</label>
                            <input type="text" name="category" placeholder="எ.கா: Nuts, Dates" required>
                            <label>பெயர் (Product Name)</label>
                            <input type="text" name="name" placeholder="எ.கா: Badam" required>
                            <label>ஸ்டாக் (Stock)</label>
                            <input type="number" name="stock" placeholder="எ.கா: 50" required>
                            <label>படத்தின் லிங்க் (Image URL)</label>
                            <input type="text" name="image" placeholder="https://..." required>

                            <h4 style="margin: 10px 0; color: #334155; font-size: 0.95rem;">எடைகள் & விலைகள்</h4>
                            <div class="weight-row">
                                <input type="text" name="weight1" placeholder="250g" required>
                                <input type="number" name="price1" placeholder="₹" required>
                            </div>
                            <div class="weight-row">
                                <input type="text" name="weight2" placeholder="500g">
                                <input type="number" name="price2" placeholder="₹">
                            </div>
                            <div class="weight-row">
                                <input type="text" name="weight3" placeholder="1kg">
                                <input type="number" name="price3" placeholder="₹">
                            </div>
                            <button type="submit" class="submit-btn">💾 டேட்டாபேஸில் சேமி</button>
                        </form>
                    </div>
                </div>

                <div class="products-section">
                    <div class="section-header">
                        <h2>உள்ள பொருட்கள்</h2>
                        <button class="clean-btn" onclick="cleanUndefined()">🧹 Clean 'undefined'</button>
                    </div>
                    <div id="product-list">லோட் ஆகிறது...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Product Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <h3>பொருளை மாற்று (Edit Product)</h3>
            <input type="hidden" id="edit-id">
            <label>வகை</label><input type="text" id="edit-category">
            <label>பெயர்</label><input type="text" id="edit-name">
            <label>ஸ்டாக்</label><input type="number" id="edit-stock">
            <label>படத்தின் லிங்க்</label><input type="text" id="edit-image">
            <h4 style="margin: 10px 0 6px; font-size: 0.9rem;">எடைகள் & விலைகள்</h4>
            <div class="weight-row">
                <input type="text" id="edit-w1" placeholder="250g"><input type="number" id="edit-p1" placeholder="₹">
            </div>
            <div class="weight-row">
                <input type="text" id="edit-w2" placeholder="500g"><input type="number" id="edit-p2" placeholder="₹">
            </div>
            <div class="weight-row">
                <input type="text" id="edit-w3" placeholder="1kg"><input type="number" id="edit-p3" placeholder="₹">
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="save-btn" onclick="saveEdit()">💾 சேமி</button>
            </div>
        </div>
    </div>

    <script>
        let loadedProducts = [];
        let loadedOrders = [];

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'orders') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('orders-tab').classList.add('active');
                loadOrders();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('products-tab').classList.add('active');
                loadProducts();
            }
        }

        // --- 1. ORDERS LOGIC ---
        // --- 1. ORDERS LOGIC (With Auto-Login Redirect) ---
        function loadOrders() {
            fetch('/api/orders')
                .then(res => {
                    // லாகின் செய்யவில்லை என்றால் தானாகவே லாகின் பக்கத்திற்குத் திருப்பிவிடும்
                    if (res.status === 401) {
                        window.location.href = '/admin/login';
                        return null;
                    }
                    return res.json();
                })
                .then(orders => {
                    if (!orders) return;
                    
                    const list = document.getElementById('orders-list');
                    const pendingBadge = document.getElementById('pending-count');

                    if (!Array.isArray(orders)) {
                        list.innerHTML = `<div style="text-align: center; padding: 30px; color: #ef4444; background: white; border-radius: 12px;">ஆர்டர்களைப் பெறுவதில் பிழை ஏற்பட்டது. தயவுசெய்து மீண்டும் உள்நுழையவும்.</div>`;
                        return;
                    }

                    loadedOrders = orders;
                    const pendingOrders = orders.filter(o => o.status === 'Pending').length;
                    pendingBadge.innerText = pendingOrders;

                    if (orders.length === 0) {
                        list.innerHTML = `<div style="text-align: center; padding: 40px; color: #64748b; background: white; border-radius: 12px;">இன்னும் எந்த ஆர்டர்களும் வரவில்லை.</div>`;
                        return;
                    }

                    list.innerHTML = '';
                    orders.forEach(o => {
                        const date = new Date(o.createdAt).toLocaleString('ta-IN', { dateStyle: 'medium', timeStyle: 'short' });
                        let itemsHtml = '';
                        (o.items || []).forEach(it => {
                            itemsHtml += `<div><span>${it.name} (${it.weight}) x ${it.qty}</span> <strong>₹${it.price * it.qty}</strong></div>`;
                        });

                        list.innerHTML += `
                            <div class="order-card">
                                <div class="order-header">
                                    <div>
                                        <span class="order-id">#${o._id.slice(-6).toUpperCase()}</span>
                                        <span class="order-date"> • ${date}</span>
                                    </div>
                                    <span style="font-size: 0.85rem; font-weight: 700; color: #64748b;">நிலை: ${o.status}</span>
                                </div>
                                <div class="order-body">
                                    <div class="customer-info">
                                        <p>👤 <strong>${o.customerName}</strong></p>
                                        <p>📞 <a href="tel:${o.phone}">${o.phone}</a> | <a href="https://wa.me/91${o.phone.replace(/[^0-9]/g, '')}" target="_blank">WhatsApp 💬</a></p>
                                        <p>📍 ${o.address}</p>
                                    </div>
                                    <div class="order-items-list">
                                        ${itemsHtml}
                                    </div>
                                    <div class="order-status-box">
                                        <div class="order-total">₹${o.totalAmount}</div>
                                        <div class="action-row">
                                            <button class="print-btn" onclick="printInvoice('${o._id}')">🖨️ Print Slip</button>
                                            <select class="status-select status-${o.status}" onchange="updateOrderStatus('${o._id}', this.value)">
                                                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                                                <option value="Dispatched" ${o.status === 'Dispatched' ? 'selected' : ''}>🚚 Dispatched</option>
                                                <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>✅ Delivered</option>
                                                <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>❌ Cancelled</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Orders load error:", err);
                    document.getElementById('orders-list').innerHTML = `<div style="text-align: center; padding: 30px; color: #ef4444; background: white; border-radius: 12px;">ஆர்டர்களை ஏற்றுவதில் பிழை ஏற்பட்டது.</div>`;
                });
        }

        // --- பார்சல் ரசீது பிரிண்ட் செய்யும் லாஜிக் ---
        function printInvoice(id) {
            const o = loadedOrders.find(item => item._id === id);
            if (!o) return;

            const printWindow = window.open('', '_blank', 'width=750,height=750');
            const itemsRows = (o.items || []).map((it, idx) => `
                <tr>
                    <td style="text-align:center;">${idx + 1}</td>
                    <td><strong>${it.name}</strong> (${it.weight})</td>
                    <td style="text-align:center;">${it.qty}</td>
                    <td style="text-align:right;">₹${it.price}</td>
                    <td style="text-align:right; font-weight:600;">₹${it.price * it.qty}</td>
                </tr>
            `).join('');

            const formattedDate = new Date(o.createdAt).toLocaleDateString('ta-IN', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Packing Slip - #${o._id.slice(-6).toUpperCase()}</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 25px; color: #1e293b; max-width: 650px; margin: 0 auto; }
                        .slip-header { border-bottom: 2px solid #15803d; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start; }
                        .brand h1 { margin: 0; color: #15803d; font-size: 24px; font-weight: 800; }
                        .brand p { margin: 4px 0 0; color: #64748b; font-size: 13px; }
                        .order-meta { text-align: right; }
                        .order-meta h3 { margin: 0; font-size: 17px; color: #0f172a; }
                        .order-meta p { margin: 3px 0 0; color: #64748b; font-size: 12px; }
                        
                        .address-box { margin: 20px 0; background: #f8faf
