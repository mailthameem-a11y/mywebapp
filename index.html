<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>நமது ஆன்லைன் ஸ்டோர்</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #1f2937; }
        /* கார்டுகளை வரிசையாகக் காட்ட Grid முறை */
        .products-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px; }
        /* ஒவ்வொரு பொருளுக்குமான டிசைன் */
        .card { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px; text-align: center; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #2563eb; margin: 0 0 10px 0; text-transform: capitalize; }
        .price { font-size: 24px; font-weight: bold; color: #16a34a; margin: 10px 0; }
        .stock { color: #6b7280; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🛒 நமது ஆன்லைன் ஸ்டோர்</h1>
    <!-- புதிய பொருளைச் சேர்க்கும் படிவம் -->
    <div style="background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 30px auto; text-align: center;">
        <h3 style="margin-top: 0; color: #2563eb;">புதிய பொருளைச் சேர்க்க</h3>
        <form action="/add-product-dynamic" method="POST">
            <input type="text" name="name" placeholder="பொருளின் பெயர்" required style="width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;"><br>
            <input type="number" name="price" placeholder="விலை (₹)" required style="width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;"><br>
            <input type="number" name="stock" placeholder="ஸ்டாக் அளவு" required style="width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;"><br>
            <button type="submit" style="background-color: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 95%; font-weight: bold;">
                💾 டேட்டாபேஸில் சேமி
            </button>
        </form>
    </div>
    
    <!-- பொருட்கள் இங்குதான் காட்டப்படும் -->
    <div class="products-container" id="product-list">
        <p>பொருட்கள் லோட் ஆகிறது...</p>
    </div>

    <script>
        // நாம் உருவாக்கிய /products API-யில் இருந்து தகவல்களைப் பெறுதல்
        fetch('/products')
            .then(response => response.json())
            .then(products => {
                const productList = document.getElementById('product-list');
                productList.innerHTML = ''; // "லோட் ஆகிறது..." என்பதை அழித்துவிடுகிறோம்

                // ஒவ்வொரு பொருளுக்கும் ஒரு HTML கார்டை உருவாக்குதல்
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                    card.innerHTML = `
                        <h3>${product.name}</h3>
                        <p class="price">₹${product.price}</p>
                        <p class="stock">ஸ்டாக்: ${product.stock} உள்ளது</p>
                        <button onclick="editProduct('${product._id}', '${product.name}', '${product.price}', '${product.stock}')" style="background-color: #eab308; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-top: 10px; margin-right: 5px;">
                            ✏️ Edit
                        </button>
                        <button onclick="deleteProduct('${product._id}')" style="background-color: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-top: 10px;">
                            🗑️ Delete
                        </button>
                    `;
                    // பொருளை அப்டேட் செய்வதற்கான ஃபங்ஷன்
        function editProduct(id, name, oldPrice, oldStock) {
            // புதிய விலையைக் கேட்பது
            let newPrice = prompt(name + " - புதிய விலையை உள்ளிடவும்:", oldPrice);
            if (newPrice === null) return; // Cancel செய்தால் நின்றுவிடும்
            
            // புதிய ஸ்டாக் அளவைக் கேட்பது
            let newStock = prompt(name + " - புதிய ஸ்டாக் அளவை உள்ளிடவும்:", oldStock);
            if (newStock === null) return;

            // புதிய தகவல்களைச் சர்வருக்கு அனுப்புதல் (PUT Request)
            fetch('/update-product/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ price: newPrice, stock: newStock })
            })
            .then(response => response.json())
            .then(data => {
                alert("பொருள் வெற்றிகரமாக அப்டேட் செய்யப்பட்டது!");
                window.location.reload(); // புதிய தகவல்களுடன் பக்கத்தை ரீலோட் செய்ய
            })
            .catch(err => console.error(err));
        }
                    productList.appendChild(card);
                });
            })
            .catch(error => console.error('Error fetching data:', error));
            // பொருளை அழிப்பதற்கான ஃபங்ஷன்
function deleteProduct(id) {
    if(confirm("இந்தப் பொருளை நிச்சயமாக அழிக்க வேண்டுமா?")) {
        fetch('/delete-product/' + id)
        .then(response => {
            alert("பொருள் வெற்றிகரமாக அழிக்கப்பட்டது!");
            window.location.reload(); 
        })
        .catch(err => console.error(err));
    }
}
    </script>

</body>
</html>
