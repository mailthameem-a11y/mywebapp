<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அட்மின் பேனல் - Royal Nuts</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 20px; margin: 0;}
        h1 { text-align: center; color: #0f172a; margin-bottom: 30px;}
        .dashboard-container { display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap;}
        .form-section { flex: 1; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 320px; height: fit-content;}
        .form-section h3 { margin-top: 0; color: #16a34a; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px;}
        .form-section input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;}
        .weight-row { display: flex; gap: 10px; margin-bottom: 10px;}
        .weight-row input { margin: 0;}
        .submit-btn { background: #16a34a; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 10px;}
        .submit-btn:hover { background: #15803d; }
        
        .products-section { flex: 2; min-width: 320px;}
        .products-section h2 { margin-top: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        .card img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0;}
        .card-info { flex: 1; }
        .card-info h3 { margin: 0 0 8px; color: #0f172a;}
        .card-info p { margin: 0; color: #475569; font-size: 0.95rem; line-height: 1.5;}
        
        .card-actions { display: flex; gap: 8px; }
        .card-actions button { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold;}
        .edit-btn { background: #eab308; color: #1e293b !important; }
        .edit-btn:hover { background: #ca8a04; color: white !important; }
        .del-btn { background: #ef4444; }
        .del-btn:hover { background: #dc2626; }

        /* Edit Popup Modal Styling */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px);}
        .modal { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative; animation: slideDown 0.25s ease-out;}
        @keyframes slideDown { from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal h3 { margin-top: 0; color: #0f172a; font-size: 1.4rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;}
        .modal label { font-weight: 600; color: #475569; font-size: 0.9rem;}
        .modal input { width: 100%; padding: 10px; margin: 6px 0 16px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;}
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 1.4rem; cursor: pointer; color: #94a3b8; border: none; background: none;}
        .close-modal:hover { color: #0f172a; }
        
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;}
        .modal-actions button { padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none;}
        .cancel-btn { background: #f1f5f9; color: #475569; }
        .save-btn { background: #2563eb; color: white; }
        .save-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <h1>🛒 அட்மின் பேனல்</h1>
    <div class="dashboard-container">
        
        <!-- Add Product Form -->
        <div class="form-section">
            <h3>+ புதிய பொருளைச் சேர்க்க</h3>
            <form action="/add-product-dynamic" method="POST">
                <label>வகை (Category)</label>
                <input type="text" name="category" placeholder="எ.கா: Nuts, Dates" required>
                
                <label>பெயர் (Product Name)</label>
                <input type="text" name="name" placeholder="எ.கா: Badam" required>
                
                <label>ஸ்டாக் (Stock)</label>
                <input type="number" name="stock" placeholder="எ.கா: 50" required>
                
                <label>படத்தின் லிங்க் (Image URL)</label>
                <input type="text" name="image" placeholder="https://..." required>

                <h4 style="margin: 15px 0 10px; color: #334155;">எடைகள் & விலைகள் (Variants)</h4>
                
                <div class="weight-row">
                    <input type="text" name="weight1" placeholder="எடை 1 (எ.கா: 250g)" required>
                    <input type="number" name="price1" placeholder="விலை ₹" required>
                </div>
                <div class="weight-row">
                    <input type="text" name="weight2" placeholder="எடை 2 (எ.கா: 500g)">
                    <input type="number" name="price2" placeholder="விலை ₹">
                </div>
                <div class="weight-row">
                    <input type="text" name="weight3" placeholder="எடை 3 (எ.கா: 1kg)">
                    <input type="number" name="price3" placeholder="விலை ₹">
                </div>

                <button type="submit" class="submit-btn">💾 டேட்டாபேஸில் சேமி</button>
            </form>
        </div>

        <!-- Product List -->
        <div class="products-section">
            <h2>உள்ள பொருட்கள்</h2>
            <div id="product-list">லோட் ஆகிறது...</div>
        </div>
    </div>

    <!-- Edit Modal / Popup Box -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <h3>பொருளை மாற்று (Edit Product)</h3>
            
            <input type="hidden" id="edit-id">
            
            <label>வகை (Category)</label>
            <input type="text" id="edit-category">
            
            <label>பெயர் (Product Name)</label>
            <input type="text" id="edit-name">
            
            <label>விலை (₹ Price)</label>
            <input type="number" id="edit-price">
            
            <label>ஸ்டாக் (Stock)</label>
            <input type="number" id="edit-stock">
            
            <label>படத்தின் லிங்க் (Image URL)</label>
            <input type="text" id="edit-image">
            
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="save-btn" onclick="saveEdit()">💾 Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        fetch('/products').then(res => res.json()).then(products => {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            products.forEach(p => {
                const imgSrc = p.image || 'https://images.unsplash.com/photo-1596591606975-97ee5cef3a1e?q=80&w=200';
                const encodedImg = encodeURIComponent(imgSrc);

                let priceText = '';
                if (p.weights && p.weights.length > 0) {
                    priceText = p.weights.map(w => `${w.weight}: ₹${w.price}`).join(' | ');
                } else if (p.price) {
                    priceText = `₹${p.price}`;
                } else {
                    priceText = 'விலை குறிப்பிடப்படவில்லை';
                }

                list.innerHTML += `
                    <div class="card">
                        <img src="${imgSrc}" alt="${p.name}">
                        <div class="card-info">
                            <h3>${p.name}</h3>
                            <p><strong>விலை விவரம்:</strong> ${priceText} <br> <strong>ஸ்டாக்:</strong> ${p.stock} &nbsp;|&nbsp; <strong>வகை:</strong> ${p.category}</p>
                        </div>
                        <div class="card-actions">
                            <button class="edit-btn" onclick="openEditModal('${p._id}', '${p.name}', '${p.category || ''}', '${p.price || 0}', '${p.stock || 0}', '${encodedImg}')">✏️ Edit</button>
                            <button class="del-btn" onclick="deleteProduct('${p._id}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });
        });

        function deleteProduct(id) {
            if(confirm("நிச்சயமாக அழிக்க வேண்டுமா?")) {
                fetch('/delete-product/' + id).then(() => window.location.reload());
            }
        }

        // --- Edit Modal Functions ---
        function openEditModal(id, name, category, price, stock, encodedImage) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-category').value = category;
            document.getElementById('edit-price').value = price;
            document.getElementById('edit-stock').value = stock;
            document.getElementById('edit-image').value = decodeURIComponent(encodedImage);
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const updatedData = {
                name: document.getElementById('edit-name').value,
                category: document.getElementById('edit-category').value,
                price: Number(document.getElementById('edit-price').value),
                stock: Number(document.getElementById('edit-stock').value),
                image: document.getElementById('edit-image').value
            };

            fetch('/update-product/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
