<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login - Royal Nuts</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .logo-badge {
            display: inline-block;
            font-size: 2.2rem;
            margin-bottom: 12px;
        }
        h2 { color: #0f172a; font-size: 1.5rem; margin-bottom: 6px; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }

        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #15803d; box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15); }

        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        button {
            width: 100%;
            background: #15803d;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        button:hover { background: #166534; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .back-link { display: inline-block; margin-top: 18px; font-size: 0.85rem; color: #64748b; text-decoration: none; }
        .back-link:hover { color: #0f172a; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-badge">🔐</div>
        <h2>Royal Nuts Admin</h2>
        <p>மேலாண்மைப் பக்கத்திற்கு உள்நுழையவும்</p>

        <div class="error-msg" id="errorMsg">பயனர் பெயர் அல்லது கடவுச்சொல் தவறானது!</div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>பயனர் பெயர் (Username)</label>
                <input type="text" id="username" placeholder="பயனர் பெயர்" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>கடவுச்சொல் (Password)</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" id="loginBtn">உள்நுழை (Login)</button>
        </form>

        <a href="/" class="back-link">← கடை முகப்புக்குத் திரும்பு</a>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.innerText = 'சரிபார்க்கிறது...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = '/admin';
                    return;
                }
                // சர்வர் அனுப்பும் செய்தியை (எ.கா: அதிக முயற்சிகள்) காட்டும்
                errorMsg.innerText = data.message || 'பயனர் பெயர் அல்லது கடவுச்சொல் தவறானது!';
            } catch (err) {
                errorMsg.innerText = 'சர்வருடன் இணைக்க முடியவில்லை. சில வினாடிகள் கழித்து மீண்டும் முயற்சிக்கவும்.';
            }

            errorMsg.style.display = 'block';
            btn.innerText = 'உள்நுழை (Login)';
            btn.disabled = false;
        }
    </script>
</body>
</html>
